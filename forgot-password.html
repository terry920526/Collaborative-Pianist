<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Recover access to your Accord account.">
<meta name="robots" content="noindex">
<title>Forgot password – Accord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="recovery-page">
  <section class="recovery-card" aria-labelledby="recoveryTitle">
    <a class="recovery-logo" href="index.html" aria-label="Accord home">Accord</a>
    <h1 id="recoveryTitle">Forgot your password?</h1>
    <p class="recovery-intro">Enter the email address associated with your Accord account. We’ll send you a link to reset your password if an account matches.</p>
    <form id="forgotForm" class="form" novalidate>
      <div class="field"><label for="recoveryEmail">Email address</label><input id="recoveryEmail" name="email" type="email" autocomplete="email" required maxlength="254"></div>
      <p class="err" id="recoveryError" role="alert" hidden></p>
      <p class="recovery-status" id="recoveryStatus" role="status" aria-live="polite" hidden></p>
      <button class="btn primary block" id="recoverySubmit" type="submit">Send reset link</button>
    </form>
    <p class="recovery-back"><a href="login.html">Back to log in</a></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/pages/forgot-password.js"></script>
</body>
</html>

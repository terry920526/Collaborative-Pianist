<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Choose a new password for your Accord account.">
<meta name="robots" content="noindex">
<title>Reset password – Accord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="recovery-page">
  <section class="recovery-card" aria-labelledby="resetTitle">
    <a class="recovery-logo" href="index.html" aria-label="Accord home">Accord</a>
    <h1 id="resetTitle">Choose a new password</h1>
    <p class="recovery-intro" id="resetIntro">Enter and confirm your new password below.</p>
    <form id="resetForm" class="form" novalidate hidden>
      <div class="field"><label for="newPassword">New password</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required><small class="password-hint">Use at least 8 characters, including an uppercase letter, a lowercase letter, and a digit.</small></div>
      <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      <p class="err" id="resetError" role="alert" hidden></p>
      <button class="btn primary block" id="resetSubmit" type="submit">Update password</button>
    </form>
    <p class="recovery-status" id="resetStatus" role="status" aria-live="polite" hidden></p>
    <div id="resetInvalid" class="recovery-status" role="status" hidden></div>
    <p class="recovery-back"><a href="login.html">Back to log in</a></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/pages/reset-password.js"></script>
</body>
</html>
